<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>VisualSpectrum 浮层</title>
  <!--
    浮层页面 —— 由 `QWebEngineView` 以**本地文件**方式加载（不是 HTTP，所以拿不到 /api/*）：

      * 画面全部由 Canvas 画（`static/js/lib/spectrum.js`，与配置页预览**共用同一份**）；
      * 三项设置与每一帧频段由 Python 推来（`window.VisualSpectrum.setAppearance / pushFrame`）；
      * CRT 的扫描线 / 暗角 / 轻微闪烁由 CSS 完成（见 overlay.css），比在 Canvas 里画便宜。

    渲染在页面载入后立刻开始（浮层窗口一启动就是可见的）；配置页与桌面浮层共用同一份
    `spectrum.js`，Python 只负责推设置与每一帧频段。
  -->
  <link rel="stylesheet" href="static/css/overlay.css">
</head>

<body>
  <div id="stage">
    <canvas id="spectrum"></canvas>
  </div>
  <script type="module" src="static/js/overlay.js"></script>
</body>

</html>
