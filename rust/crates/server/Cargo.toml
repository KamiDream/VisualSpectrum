[package]
name = "vs-server"
description = "VisualSpectrum 的本地配置服务（axum）：/api/* + 配置页静态资源"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
vs-core = { path = "../core" }
vs-audio = { path = "../audio" }

axum = "0.8"
tokio = { version = "1", features = ["rt", "net"] }
serde_json = "1"
# 把 web/ 配置页嵌进二进制 → 发布时只需要一个可执行文件
include_dir = "0.7"
